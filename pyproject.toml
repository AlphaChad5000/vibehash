[build-system]
requires = ["setuptools>=77"]  # for the SPDX `license` expression below
build-backend = "setuptools.build_meta"

[project]
name = "vibehash"
version = "0.5.26"
description = "Vibe Hash: earn VIBE by training AI models on everyday computers (testnet)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "cryptography>=42"]
# Posting a fine-tune reads chats with the model's own tokenizer and chat template. Workers don't need these; they
# need PyTorch, whose right build `vibehash install-gpu` picks for the GPU.
# Evo mode (`testnet --evo`, `testnet --evo2`) runs the model with transformers (and PyTorch, which `vibehash
# install-gpu` installs); its ARC-Easy science questions come through datasets.
# The app's window (window.py) is the system's web view through pywebview; the downloadable launcher installs this extra.
optional-dependencies = {finetune = ["tokenizers>=0.15", "jinja2>=3.1"], evo = ["transformers>=4.50", "datasets>=2.18"], app = ["pywebview>=6.2"]}
keywords = ["proof-of-useful-work", "distributed-training", "cryptocurrency", "testnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://vibehash.org"
Source = "https://github.com/AlphaChad5000/vibehash"

[project.scripts]
vibehash = "vibehash.cli:main"

[tool.setuptools]
packages = ["vibehash"]

[tool.setuptools.package-data]
vibehash = ["data/*.csv", "data/*.txt", "data/*.json", "data/*.html", "data/*.ico", "data/*.png"]  # the sample data `vibehash example` writes out; the BIP39 word list; DeepSeek-V4.1-Flash's per-tensor manifest; the explorer page nodes serve
