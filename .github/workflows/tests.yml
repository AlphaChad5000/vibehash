# The fast tests on every push and pull request, on the oldest and a current supported Python.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[finetune]
      # CPU PyTorch for tests.test_deepseek, which also fetches DeepSeek's reference code from the Hub (~100 KB), and
      # tests.test_finetune, whose models are tiny and made up (real ones are opt-in: VIBEHASH_REAL_MODELS=1).
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest tests.test_core tests.test_consensus tests.test_hardening tests.test_earn_in tests.test_round_length tests.test_record_v2 tests.test_rules_v2 tests.test_rules_v4 tests.test_shards tests.test_minerui tests.test_trainui tests.test_transformer tests.test_moe tests.test_hub tests.test_sharded_rounds tests.test_deepseek tests.test_finetune tests.test_deepseek_top tests.test_deepseek_prep tests.test_deepseek_split tests.test_think_shorter tests.test_modelstore tests.test_deepseek_job tests.test_deepseek_worker tests.test_deepseek_network tests.test_deepseek_program tests.test_referee_deepseek tests.test_dispute tests.test_selftest tests.test_setup tests.test_menu tests.test_agents tests.test_versions_supply tests.test_genesis_check

  # Evo Hash's tests (tests.test_es, and test_es2's spec tests) on CPU PyTorch with transformers: their models are tiny
  # and made up, so nothing is downloaded. About 3.5 minutes on the owner's PC. test_es2's network test is left out
  # (its parent's round waits out a 321 s compute deadline on a slow machine) and its engine test needs a CUDA GPU.
  # Not a required check yet: it can go red without blocking a merge.
  evo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[finetune,evo]
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest tests.test_es tests.test_es2.SpecTests
