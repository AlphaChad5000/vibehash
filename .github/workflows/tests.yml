# The fast tests on every push and pull request, on the oldest and a current supported Python.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_core tests.test_consensus tests.test_hardening tests.test_earn_in tests.test_round_length tests.test_record_v2 tests.test_rules_v2 tests.test_shards tests.test_minerui tests.test_trainui tests.test_transformer tests.test_moe
