# Publishes vibehash to PyPI when a version tag is pushed, e.g.:
#   git tag v0.4.0 && git push origin v0.4.0
# PyPI trusts this workflow through a "trusted publisher" (no API token is stored anywhere):
# project vibehash, owner AlphaChad5000, repository vibehash, workflow publish.yml, environment pypi.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"; exit 1
          fi
      - name: Run the fast tests
        run: |
          python -m pip install -e .
          python -m unittest tests.test_core tests.test_consensus tests.test_hardening
      - name: Build the wheel and source archive
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vibehash
    permissions:
      id-token: write  # what lets PyPI's trusted publishing recognise this workflow
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
