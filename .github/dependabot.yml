# Dependabot: a weekly look at the Python dependencies (pyproject.toml, agents/requirements-train.txt) and the
# GitHub Actions the workflows use. Security fixes come as soon as an advisory is published, whatever the schedule.
# Updates are grouped and the open PRs capped, so they never pile up (one PR at a time is the routine here).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      agents:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
